<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Party hard but secretly</title>
</head>
<body>
    <div class="full_page">
        <div class="left_side">
            <h1 class="brand">Where ?</h1>
        </div>
        <div class="right_side">
            <form action="" method="">
                <div class="form_container">
                    <div class="first_section">
                        <h1>Great people. Great places. Great parties.</h1>
                    </div>
                    <div class="second_section">
                        <h1>Subscribe now, party then.</h1>
                    </div>
                    <div class="thir">
                        <div>
                            <label for="f-name">First name</label>
                            <input type="text" name="f-name" id="f-name" required> 
                        </div>
                        <div>
                            <label for="l-name">Last name</label>
                            <input type="text" name="l-name" id="l-name" class="form_input" required> 
                        </div>
                        <div>
                            <label for="mail">Email</label>
                            <input type="mail" name="email" id="email" class="form_input" required> 
                        </div>
                        <div>
                            <label for="phone">Phone number</label>
                            <input type="phone" name="phone" id="phone" class="form_input" required> 
                        </div>
                        <div>
                            <label for="password">Password</label>
                            <input type="password" name="user-password" id="user-password" class="form_input" required>
                        </div>
                        <div>
                            <label for="password">Confirm password</label>
                            <input type="password" name="user-password-confirm" id="user-password-confirm" class="form_input" required>
                        </div>
                        <div>
                            <button type="submit" class="submit_btn">Rock it</button>
                        </div>
                    </div>    
                </div>
            </form>
        </div>
    </div>
</body>
</html>
